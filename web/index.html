<!doctype html>
<html lang="fr" data-wallpaper="forest">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Nodra</title>
    <script>
      // Thème et fond d'écran Apple appliqués avant le rendu (sans flash)
      try {
        var t = localStorage.getItem("nodra-theme")
        var dark = t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)

        var wp = localStorage.getItem("nodra-wallpaper") || "forest"
        document.documentElement.setAttribute("data-wallpaper", wp)

        var img = localStorage.getItem("nodra-wallpaper-image")
        if (img && (wp === "custom" || wp === "image")) {
          document.documentElement.style.setProperty("--wallpaper-image", 'url("' + img.replace(/["\\\n]/g, encodeURIComponent) + '")')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

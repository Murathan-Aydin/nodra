name: Image
# Image Docker de Nodra sur ghcr.io : "edge" à chaque push sur main (après la CI), "vX.Y.Z" + "latest"
# et une release GitHub pour chaque tag vX.Y.Z (annoncée aux instances par la vérification des mises à jour).
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/murathan-aydin/nodra

jobs:
  image:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.event.workflow_run.head_sha }}
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release GitHub
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Nodra $GITHUB_REF_NAME"

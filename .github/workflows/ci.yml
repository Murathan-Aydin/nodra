name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nodra
          POSTGRES_PASSWORD: nodra
          POSTGRES_DB: nodra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nodra" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          NODRA_TEST_DATABASE_URL: postgres://nodra:nodra@localhost:5432/nodra?sslmode=disable
